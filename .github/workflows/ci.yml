name: Portable CI and historical audit

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_historical_audit:
        description: Run artifact-backed historical tests (requires verified outputs/ bundle)
        required: true
        type: boolean
        default: false

jobs:
  portable:
    name: Portable Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install portable test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Portable tests (historical artifact cases excluded by marker)
        run: python -m pytest -q -m "not historical"
      - name: Ruff lint (CI infrastructure)
        run: ruff check tests/conftest.py scripts/ci/verify_historical_bundle.py
      - name: Ruff formatting check (CI infrastructure)
        run: ruff format --check tests/conftest.py scripts/ci/verify_historical_bundle.py
      - name: CLI smoke
        run: |
          hf-tcm doctor
          hf-tcm check-config configs/m0_smoke.json

  historical-audit:
    name: Historical audit (verified artifacts only)
    if: github.event_name == 'workflow_dispatch' && inputs.run_historical_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify historical artifact bundle and SHA-256 manifest
        run: python scripts/ci/verify_historical_bundle.py
      - name: Historical tests (no skips or xfails)
        run: python -m pytest -q -m historical
